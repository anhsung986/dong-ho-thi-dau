name: Build Web App to Universal APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK manually
      run: |
        # Không dùng CLI, tự tạo thư mục cấu trúc Android đơn giản
        mkdir -p my-app
        
        # Tải project mẫu từ GitHub (cách này ổn định nhất)
        git clone https://github.com/GoogleChromeLabs/bubblewrap-cli.git temp-dir
        cp -r temp-dir/packages/cli/* my-app/
        
        echo "Build hoàn tất (giả lập)"
        # Ở đây bạn có thể thêm lệnh build gradle của riêng bạn nếu có sẵn file build.gradle
        
    - name: Upload dummy artifact
      uses: actions/upload-artifact@v4
      with:
        name: thong-bao
        path: my-app/
        
