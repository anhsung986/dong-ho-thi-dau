name: Build Web App to Universal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Build Android APK
      run: |
        # Tự động tạo thư mục android-app và cấu hình sẵn để không bị hỏi tương tác
        mkdir -p android-app
        
        # Tạo file cấu hình bwr-config.json trực tiếp
        cat << 'EOF' > android-app/bwr-config.json
        {
          "manifestUrl": "../manifest.json",
          "appName": "Đồng Hồ Của Sung Anh",
          "shortName": "DongHo",
          "startUrl": "./index.html",
          "display": "standalone",
          "themeColor": "#ff9a9e",
          "backgroundColor": "#ffffff",
          "iconUrl": "./anh.png",
          "packageId": "com.sunganh.dongho",
          "appVersion": "1.0.0",
          "appVersionCode": 1,
          "signingKey": {
            "path": "android.keystore",
            "alias": "android"
          }
        }
        EOF

        cd android-app
        # Chạy build trực tiếp bằng file cấu hình không cần init
        bubblewrap update --manifest ../manifest.json || true
        bubblewrap build
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dong-ho
        path: |
          android-app/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
          
