name: Build Web App to Universal APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - run: npm install -g @bubblewrap/cli
    
    - name: Build APK
      run: |
        # Xóa thư mục cũ để tạo mới từ đầu
        rm -rf android-app
        
        # Chạy init với --non-interactive và trỏ thẳng vào manifest
        # Đây là cách chính thống để không bị dừng lại hỏi han
        bubblewrap init --manifest ./manifest.json --directory ./android-app --non-interactive
        
        cd android-app
        bubblewrap build --non-interactive
    
    - uses: actions/upload-artifact@v4
      with:
        name: dong-ho
        path: android-app/app/build/outputs/apk/release/*.apk
        
