name: Build Web App to Universal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Build Android APK
      run: |
        echo "n" | bubblewrap init --manifest ./manifest.json --directory ./android-app --skip-validation || true
        cd android-app
        bubblewrap build --manifest ../manifest.json
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dong-ho
        path: |
          android-app/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
          
