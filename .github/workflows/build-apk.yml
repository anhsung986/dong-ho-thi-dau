name: Build Web App to Universal APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Build Android APK using Bubblewrap CLI non-interactive config
    - name: Create TWA Project Manually
      run: |
        # Sử dụng tool Bubblewrap dưới dạng tải template sẵn qua npm để không bị hỏi cấu hình
        npm install -g @bubblewrap/cli
        
        # Dùng câu lệnh tạo project tối giản không cần tương tác
        bubblewrap init --manifest ./manifest.json --directory ./android-app --skip-validation || true
        
        # Tiến hành build
        cd android-app
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          bubblewrap build --non-interactive || true
        fi
        
    - uses: actions/upload-artifact@v4
      with:
        name: dong-ho
        path: |
          android-app/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
          
