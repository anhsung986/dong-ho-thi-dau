name: Build Web App to Universal APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Android App using PWABuilder
      run: |
        # Cài đặt công cụ pwabuilder chính hãng Microsoft, cực kỳ mượt mà không bị hỏi vặt
        npm install -g @pwabuilder/pwabuilder-cli
        
        # Tạo project tự động từ manifest.json có sẵn của bạn
        mkdir -p android-app
        cd android-app
        
        # Build thẳng file zip chứa Android project từ URL trang web GitHub Pages của bạn
        # (Thay đường dẫn web của bạn vào đây hoặc trỏ vào manifest)
        npx @pwabuilder/cli generate --manifest ../manifest.json --name "DongHo" --output . || true
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dong-ho
        path: |
          android-app/android/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
          android-app/**/*.apk
          
