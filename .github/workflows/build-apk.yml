name: Build Web App to Universal APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @pwabuilder/bubblewrap

    - name: Initialize Android Project from Web Manifest/URL
      run: |
        # Tự động đóng gói file index.html thành ứng dụng Android WebView
        bubblewrap init --manifest=https://anhsung986.github.io/dong-ho-thi-dau/manifest.json --directory=android/ || true

    - name: Build APK using Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: donghothidau-app-debug
        path: android/app/build/outputs/apk/debug/dongho.apk
        
